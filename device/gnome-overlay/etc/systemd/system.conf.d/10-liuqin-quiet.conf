# liuqin: the native bootargs do carry `quiet`, but the kernel is not where it
# bites.  The kernel reads /chosen/bootargs, and ABL appends its own ~800
# characters to that same property after ours (see build-bootimg.sh), so the
# last word on the console loglevel is ABL's, not ours.  The userspace half is
# ours to set: left alone, systemd picks LogLevel=info and prints every unit it
# starts to the framebuffer console, which is most of what scrolls past on the
# panel at boot.  Raise the floor to warning: errors still reach the journal, and
# the USB rescue shell still shows everything.
[Manager]
LogLevel=warning
