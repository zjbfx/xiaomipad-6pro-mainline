# liuqin: the native bootargs carry no `quiet` (the vendor cmdline that the boot
# image inherits sets loglevel=6, and bootconfig args land after ours, so a
# `quiet` of ours would not win on the kernel side anyway).  Without it systemd
# picks LogLevel=info and prints every unit it starts to the framebuffer
# console, which is most of what scrolls past on the panel at boot.  Raise the
# floor to warning: errors still reach the journal, and the USB rescue shell
# still shows everything.
[Manager]
LogLevel=warning
