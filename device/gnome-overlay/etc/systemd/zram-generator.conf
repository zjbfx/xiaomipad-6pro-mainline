# liuqin: no zram devices, because the locked kernel cannot provide one.
#
# kernel/source.json pins a configuration in which CONFIG_ZRAM and CONFIG_ZSWAP
# are both unset (out/kernel/.config: "# CONFIG_ZRAM is not set"), and the module
# staging step installs exactly the modules that configuration builds -- so
# /usr/lib/modules/<release>/ has no zram.ko and /dev/zram0 can never appear.
#
# Fedora ships zram-generator-defaults, whose /usr/lib/systemd/zram-generator.conf
# declares [zram0] and therefore generates dev-zram0.swap on every boot.  That
# unit is After=dev-zram0.device, so it sits in a start job until the device
# times out -- and systemd's swap.target wants it, which puts the whole wait on
# the boot critical path.  Measured on the tablet 2026-09-18: swap.target landed
# at 45.502 s and graphical.target at 46.952 s, i.e. ~27 s of the boot was this
# one device that was never going to show up.  journalctl -b -p err carries the
# matching "Timed out waiting for device dev-zram0.device".
#
# This file is the upstream-documented switch ("To disable, ... create empty
# /etc/systemd/zram-generator.conf file" -- zram-generator.conf(5), and the same
# sentence is in the vendor file).  An empty or comment-only file has no [zramN]
# section, so the generator emits nothing and swap.target is reached immediately.
#
# It lives in the device layer rather than in the Fedora rootfs build because it
# is a property of the kernel both products share, not of the distribution.
#
# If CONFIG_ZRAM is ever enabled, delete this file: compressed swap is worth
# having on a 6.3 GiB device, and that is what the generator was trying to do.
