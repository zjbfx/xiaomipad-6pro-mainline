# Fedora ships Theme=bgrt, which composites the boot splash over the firmware
# BGRT image.  A tablet has no ACPI table to hand, so that theme falls back to
# a flat black background.  Theme=liqin is our own two-step theme
# (device/gnome-overlay/usr/share/plymouth/themes/liqin): the Fedora wordmark
# centred on black, no firmware background, no distribution artwork.
#
# The splash only appears at all once "splash" is on the kernel command line
# (device/native-bootargs.txt), and plymouth only finds a mode to draw into
# once something has probed the DSI connector -- that is what
# liuqin-drm-probe.service is for.
[Daemon]
Theme=liqin
